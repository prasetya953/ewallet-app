<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/beranda" text="" icon="arrow-back"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifikasi</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="markAllAsRead()" fill="clear">
        <ion-icon name="checkmark-done" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="notifications-page">
  <div class="notification-list" *ngIf="notifications.length > 0; else emptyState">
    <div class="notification-item" 
         *ngFor="let notif of notifications" 
         [class.unread]="!notif.read" 
         (click)="markAsRead(notif)">
      
      <div class="notification-icon">
        <div class="icon-container" [class]="getNotificationIcon(notif.type)">
          <ion-icon [name]="getNotificationIconName(notif.type)"></ion-icon>
        </div>
      </div>
      
      <div class="notification-content">
        <h3 class="notification-title">{{ notif.title }}</h3>
        <p class="notification-message">{{ notif.message }}</p>
        <span class="notification-time">{{ notif.time }}</span>
      </div>
      
      <div class="notification-badge" *ngIf="!notif.read">
        <div class="unread-dot"></div>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="notification-empty">
      <div class="empty-icon">
        <ion-icon name="notifications-off-outline"></ion-icon>
      </div>
      <h3>Tidak Ada Notifikasi</h3>
      <p>Notifikasi baru akan muncul di sini</p>
    </div>
  </ng-template>
</ion-content>

<style>
/* Global Styles */
ion-toolbar {
  --background: #ffffff;
  --border-color: #e2e8f0;
  --color: #1a202c;
}

.notifications-page {
  --background: #f8fafc;
}

/* Notification List */
.notification-list {
  padding: 8px 16px;
}

.notification-item {
  display: flex;
  align-items: flex-start;
  background: #ffffff;
  padding: 16px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  position: relative;
  transition: all 0.2s ease;
}

.notification-item:active {
  background: #f7fafc;
}

.notification-item.unread {
  border-left: 3px solid #3b82f6;
  background: #ffffff;
}

/* Notification Icon */
.notification-icon {
  margin-right: 12px;
  flex-shrink: 0;
}

.icon-container {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-container.payment {
  background: #dbeafe;
  color: #3b82f6;
}

.icon-container.transfer {
  background: #dcfce7;
  color: #16a34a;
}

.icon-container.promo {
  background: #fef3c7;
  color: #d97706;
}

.icon-container.system {
  background: #f3e8ff;
  color: #9333ea;
}

.icon-container.security {
  background: #fce7f3;
  color: #db2777;
}

.icon-container ion-icon {
  font-size: 20px;
}

/* Notification Content */
.notification-content {
  flex: 1;
  min-width: 0;
}

.notification-title {
  font-size: 14px;
  font-weight: 600;
  color: #1a202c;
  margin: 0 0 4px 0;
  line-height: 1.3;
}

.notification-message {
  font-size: 13px;
  color: #4a5568;
  margin: 0 0 6px 0;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.notification-time {
  font-size: 11px;
  color: #718096;
  font-weight: 500;
}

/* Notification Badge */
.notification-badge {
  margin-left: 8px;
  flex-shrink: 0;
}

.unread-dot {
  width: 8px;
  height: 8px;
  background: #3b82f6;
  border-radius: 50%;
}

/* Empty State */
.notification-empty {
  text-align: center;
  padding: 80px 40px;
}

.notification-empty .empty-icon {
  width: 80px;
  height: 80px;
  background: #f1f5f9;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}

.notification-empty .empty-icon ion-icon {
  font-size: 32px;
  color: #94a3b8;
}

.notification-empty h3 {
  font-size: 16px;
  font-weight: 600;
  color: #475569;
  margin: 0 0 8px 0;
}

.notification-empty p {
  font-size: 14px;
  color: #94a3b8;
  margin: 0;
  line-height: 1.4;
}

/* Header Button */
ion-back-button {
  --color: #4a5568;
}

ion-button[slot="end"] {
  --color: #4a5568;
}

/* Responsive */
@media (max-width: 360px) {
  .notification-list {
    padding: 8px 12px;
  }
  
  .notification-item {
    padding: 12px;
  }
  
  .icon-container {
    width: 36px;
    height: 36px;
  }
  
  .icon-container ion-icon {
    font-size: 18px;
  }
}
</style>
