<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Back"></ion-back-button>
    </ion-buttons>
    <ion-title>Forgot Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="forgot-password-content">
  <div class="container">
    <div class="header-section">
      <ion-icon name="lock-closed-outline" class="header-icon"></ion-icon>
      <h1>Reset Password</h1>
      <p>Enter your email address and we'll send you instructions to reset your password.</p>
    </div>

    <div class="form-section">
      <ion-item class="form-item">
        <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email address"
          label="Email Address"
          labelPlacement="stacked">
        </ion-input>
      </ion-item>

      <ion-button 
        expand="block" 
        class="reset-btn"
        (click)="resetPassword()">
        <ion-icon name="send-outline" slot="start"></ion-icon>
        Send Reset Instructions
      </ion-button>

      <div class="back-to-login">
        <a href="javascript:void(0)" (click)="goBack()">← Back to Login</a>
      </div>
    </div>
  </div>
</ion-content>
